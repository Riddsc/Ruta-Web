 solution:"<h1>Catálogo</h1>\n<ul id=\"catalogo\"></ul>\n\n<script>\n  const productos = [\n    { nombre: \"Café\", precio: 18000 },\n    { nombre: \"Panela\", precio: 4500 },\n    { nombre: \"Bocadillo\", precio: 6000 }\n  ];\n\n  const catalogo = document.querySelector(\"#catalogo\");\n\n  productos.forEach(p => {\n    const li = document.createElement(\"li\");\n    li.textContent = p.nombre + \" - $\" + p.precio;\n    catalogo.append(li);\n  });\n<\/script>",
 hints:["Para concatenar el texto correctamente puedes hacer: <code>li.textContent = productoEnTurno.nombre + \" - $\" + productoEnTurno.precio;</code>","No olvides hacer <code>catalogo.append(li);</code> al final de la función interna del forEach."],
 tests:[
  {d:"Hay exactamente 3 elementos <code>&lt;li&gt;</code> generados en #catalogo", t:function(c){return c.all("#catalogo li").length===3}},
  {d:"El primer elemento dice correctamente “Café - $18000”", t:function(c){var li=c.q("#catalogo li");return !!li&&li.textContent.trim()==="Café - $18000"}},
  {d:"Usaste <code>createElement</code> y <code>append</code> (o appendChild)", t:function(c){return /createElement/.test(c.code) && /append/.test(c.code)}}
 ]},
{id:"p2", lvl:"pro", title:"JSON (Comunicando aplicaciones)", mins:8,
 theory:"<p>¿Cómo se pasan datos diferentes lenguajes (ej. un servidor en Python a una página en JS)? Usando texto plano formateado universalmente. El formato dominante absoluto de la web es <b>JSON (JavaScript Object Notation)</b>.</p><p>Visualmente es idéntico a un objeto o array de JavaScript, pero está todo <b>encerrado en un String gigante</b> y requiere que las claves vayan en comillas dobles.</p><ul><li><code>JSON.parse(stringJSON)</code>: Traduce el String de texto que llegó de internet y lo convierte en un Objeto/Array real de JS para que puedas trabajar con él.</li><li><code>JSON.stringify(objetoJS)</code>: Toma tus variables de JS y las aplasta en un String formateado para que puedas enviarlo por internet a otro sistema.</li></ul>",
 example:"// Recibiendo datos de internet (llegan como string puro)\nconst textoAPI = '{\"ciudad\":\"Cali\", \"temp\":28}';\n\n// Convertimos el texto a objeto JS trabajable\nconst clima = JSON.parse(textoAPI);\nconsole.log(clima.ciudad); // Ahora sí podemos acceder a 'Cali'\n\n// Para enviar datos a guardar:\nconst aEnviar = JSON.stringify(clima);",
 task:"<p>Practiquemos ambas conversiones. Escribe dos funciones simples:</p><p>1. <code>leerNombre(stringDeTexto)</code>: Recibe un string JSON, usa <code>JSON.parse()</code> para convertirlo en objeto, y devuelve únicamente el valor de su propiedad <code>nombre</code>.<br>2. <code>aTexto(objetoJS)</code>: Recibe un objeto normal de JavaScript y devuelve su versión en texto (String) usando <code>JSON.stringify()</code>.</p>",
 starter:"<script>\n  function leerNombre(textoJson) {\n    // Completa aquí\n  }\n\n  function aTexto(objetoNormal) {\n    // Completa aquí\n  }\n\n  // Pruebas (míralas en la consola):\n  console.log(leerNombre('{\"nombre\":\"Valentina\",\"rol\":\"Diseñadora\"}'));\n  console.log(aTexto({ curso: \"Ruta Web\", nivel: 4 }));\n<\/script>",
 solution:"<script>\n  function leerNombre(textoJson) {\n    const datosObjeto = JSON.parse(textoJson);\n    return datosObjeto.nombre;\n  }\n\n  function aTexto(objetoNormal) {\n    return JSON.stringify(objetoNormal);\n  }\n\n  console.log(leerNombre('{\"nombre\":\"Valentina\",\"rol\":\"Diseñadora\"}'));\n  console.log(aTexto({ curso: \"Ruta Web\", nivel: 4 }));\n<\/script>",
 hints:["En <code>leerNombre</code> guarda el resultado del parseo en una constante y luego retorna la propiedad .nombre de esa constante.","En <code>aTexto</code> basta con una sola línea retornando el resultado del método de stringify."],
 tests:[
  {d:"<code>leerNombre</code> convierte y devuelve correctamente el nombre", t:function(c){return c.ev("leerNombre")('{"nombre":"Sofía","edad":30}')==="Sofía"}},
  {d:"<code>aTexto</code> convierte el objeto a una cadena JSON válida", t:function(c){return c.ev("aTexto")({a:1,b:"x"})==='{"a":1,"b":"x"}'}}
 ]},
{id:"p3", lvl:"pro", title:"Asincronía (Promesas, async/await)", mins:10,
 theory:"<p>Peticiones web (como buscar una película en Netflix) no ocurren de inmediato. Tardan milisegundos o segundos por la red. JavaScript normal ejecutaría la siguiente línea de código antes de que la respuesta llegara y fallaría.</p><p>Para tareas lentas, usamos herramientas de asincronía. La forma moderna es usar funciones <b>async</b> junto con la palabra clave <b>await</b>.</p><ul><li>Declarar una función como <code>async function...</code> permite usar superpoderes asíncronos en su interior.</li><li>La palabra <code>await</code> antes de una tarea lenta (como pedir datos a un servidor - fetch) le dice a JS: <i>\"Pausa la ejecución de esta función específicamente y espera hasta que el servidor conteste, luego sigue.\"</i></li></ul><p>Detrás de escena, esto se gestiona con objetos especiales llamados 'Promesas'.</p>",
 example:"// Simulamos una tarea lenta (como una descarga)\nfunction simularRedLenta() {\n  return new Promise(resolver => setTimeout(resolver, 1500));\n}\n\n// Función asíncrona\nasync function cargarDatos() {\n  console.log(\"Descargando...\");\n  await simularRedLenta(); // Pausa la función 1.5 segundos\n  console.log(\"¡Descarga completa!\");\n}",
 task:"<p>Te proveemos de una función <code>esperar(ms)</code> que crea un retardo real (devuelve una Promesa). Escribe una función asíncrona <code>async function obtenerPerfil()</code>.</p><p>Dentro de ella, utiliza <code>await</code> para pausar la ejecución llamando a <code>esperar(500)</code> (medio segundo). Después de esa espera, la función debe devolver un objeto simple: <code>{ usuario: \"dev_experto\", activo: true }</code>.</p>",
 starter:"<script>\n  // NO modifiques esta función de retardo\n  function esperar(milisegundos) {\n    return new Promise(res => setTimeout(res, milisegundos));\n  }\n\n  // Escribe tu función asíncrona aquí:\n  \n\n  // Lo probamos (imprime una Promesa, y luego de 0.5s imprime el objeto):\n  obtenerPerfil().then(perfil => console.log(\"Llegó el perfil:\", perfil));\n<\/script>",
 solution:"<script>\n  function esperar(milisegundos) {\n    return new Promise(res => setTimeout(res, milisegundos));\n  }\n\n  async function obtenerPerfil() {\n    await esperar(500);\n    return { usuario: \"dev_experto\", activo: true };\n  }\n\n  obtenerPerfil().then(perfil => console.log(\"Llegó el perfil:\", perfil));\n<\/script>",
 hints:["Define la función declarando <code>async function obtenerPerfil() { ... }</code>.","Adentro, en la primera línea pon <code>await esperar(500);</code>. En la siguiente línea haz el return del objeto literal."],
 tests:[
  {d:"Creaste la función <code>obtenerPerfil</code> utilizando la palabra clave <code>async</code>", t:function(c){return /async\s+function\s+obtenerPerfil/.test(c.code)}},
  {d:"Usaste <code>await</code> en el interior esperando el tiempo", t:function(c){return /await\s+esperar/.test(c.code)}},
  {d:"La función efectivamente se demora (asincronía real probada)", t:function(c){var t0=Date.now();return c.ev("obtenerPerfil")().then(function(){return Date.now()-t0>=450})}},
  {d:"Al resolverse, la promesa devuelve el objeto correcto", t:function(c){return c.ev("obtenerPerfil")().then(function(p){return p&&p.usuario==="dev_experto"&&p.activo===true})}}
 ]},
{id:"p4", lvl:"pro", title:"Proyecto Final: Lista de Tareas (To-Do App)", mins:20,
 theory:"<p>La culminación de nuestro viaje. Construir una Lista de Tareas (To-Do List) es el proyecto rito de iniciación de todo desarrollador frontend. Combina todo lo aprendido: Maquetación HTML básica, estilos interactivos CSS, escuchar eventos JS, manipular el DOM y aplicar lógica condicional.</p><p>Para que la app se sienta profesional, aplicaremos validaciones UX (Experiencia de Usuario) comunes:</p><ul><li>No debe permitir agregar tareas completamente vacías. Para esto leeremos el valor del input y usaremos el método string <code>.trim()</code> que borra espacios en blanco accidentales al inicio o final.</li><li>Después de añadir exitosamente la tarea, el campo de texto debe vaciarse automáticamente (<code>input.value = \"\"</code>) dejándolo listo para otra escritura.</li><li>Permitiremos marcar tareas como completadas alternando una clase CSS especial al tocarlas.</li></ul>",
 example:"// Validación típica de input antes de procesar\nboton.addEventListener(\"click\", () => {\n  const textoEscrito = campo.value.trim();\n  // Si después de limpiar espacios quedó vacío, salimos tempranamente (return detiene la función)\n  if (textoEscrito === \"\") {\n    return;\n  }\n  //... crear elementos\n});",
 task:"<p>Completa la lógica JavaScript para hacer funcionar la To-Do app. Las piezas visuales y los identificadores (IDs) ya están listos.</p><p>1. En el evento click del botón, lee el valor del input, aplícale <code>.trim()</code> y guárdalo en una constante.<br>2. Evalúa si el texto está vacío (es igual a <code>\"\"</code>). Si es así, no hagas nada (haz un return directo).<br>3. Si hay texto válido, crea un nuevo elemento <code>&lt;li&gt;</code> y asígnale el texto.<br>4. Añádele al propio <code>&lt;li&gt;</code> que acabas de crear un evento de tipo 'click', para que al ser tocado, alterne (toggle) la clase css predefinida <code>hecha</code>.<br>5. Inserta el <code>&lt;li&gt;</code> en la lista (ul) usando append y finalmente limpia el valor del campo input (igualándolo a string vacío).</p>",
 starter:"<style>\n  body { font-family: system-ui; max-width: 420px; margin: 24px auto; padding: 0 16px; }\n  .fila { display: flex; gap: 8px; }\n  input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }\n  button { padding: 10px 15px; background: #0f766e; color: white; border: none; border-radius: 4px; cursor: pointer; }\n  ul { list-style: none; padding: 0; margin-top: 20px; }\n  li { padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; transition: background 0.2s; }\n  li:hover { background-color: #f8fafc; }\n  /* Esta clase se aplicará dinámicamente con JS */\n  .hecha { text-decoration: line-through; opacity: 0.5; color: green; }\n</style>\n\n<h1>Mis Tareas Pendientes</h1>\n<div class=\"fila\">\n  <input id=\"tarea\" placeholder=\"Ej. Comprar leche...\">\n  <button id=\"agregar\">Añadir</button>\n</div>\n<ul id=\"tareas\"></ul>\n\n<script>\n  const campoTexto = document.querySelector(\"#tarea\");\n  const btnAgregar = document.querySelector(\"#agregar\");\n  const listaUl = document.querySelector(\"#tareas\");\n\n  // Añade el evento click al btnAgregar y desarrolla toda la lógica descrita\n\n<\/script>",
 solution:"<style>\n  body { font-family: system-ui; max-width: 420px; margin: 24px auto; padding: 0 16px; }\n  .fila { display: flex; gap: 8px; }\n  input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }\n  button { padding: 10px 15px; background: #0f766e; color: white; border: none; border-radius: 4px; cursor: pointer; }\n  ul { list-style: none; padding: 0; margin-top: 20px; }\n  li { padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; transition: background 0.2s; }\n  li:hover { background-color: #f8fafc; }\n  /* Esta clase se aplicará dinámicamente con JS */\n  .hecha { text-decoration: line-through; opacity: 0.5; color: green; }\n</style>\n\n<h1>Mis Tareas Pendientes</h1>\n<div class=\"fila\">\n  <input id=\"tarea\" placeholder=\"Ej. Comprar leche...\">\n  <button id=\"agregar\">Añadir</button>\n</div>\n<ul id=\"tareas\"></ul>\n\n<script>\n  const campoTexto = document.querySelector(\"#tarea\");\n  const btnAgregar = document.querySelector(\"#agregar\");\n  const listaUl = document.querySelector(\"#tareas\");\n\n  btnAgregar.addEventListener(\"click\", () => {\n    // 1. Validar texto\n    const textoValidado = campoTexto.value.trim();\n    if (textoValidado === \"\") {\n      return;\n    }\n\n    // 2. Crear elemento\n    const nuevoLi = document.createElement(\"li\");\n    nuevoLi.textContent = textoValidado;\n\n    // 3. Añadirle el comportamiento de tachado individual\n    nuevoLi.addEventListener(\"click\", () => {\n      nuevoLi.classList.toggle(\"hecha\");\n    });\n\n    // 4. Pintar en pantalla y limpiar input\n    listaUl.append(nuevoLi);\n    campoTexto.value = \"\";\n  });\n<\/script>",
 hints:["Revisa paso por paso. Primero lee y valida: <code>const txt = campoTexto.value.trim(); if(txt === \"\") return;</code>.","Luego creas y configuras el elemento. ¡Atención! el evento para tachar se le agrega a esa constante 'nuevoLi' que acabas de crear, no a la lista general.","Por último, inyéctalo con <code>listaUl.append(...)</code> y vacía el string del campoTexto.value."],
 tests:[
  {d:"Escribir texto y presionar el botón crea exitosamente un elemento <code>&lt;li&gt;</code> visible", t:function(c){var i=c.q("#tarea");i.value="Aprender JS";c.q("#agregar").click();var li=c.all("#tareas li");return li.length===1&&li[0].textContent.trim()==="Aprender JS"}},
  {d:"Limpia el campo de texto después de agregar", t:function(c){return c.q("#tarea").value===""}},
  {d:"Valida y evita crear tareas vacías (incluso con espacios)", t:function(c){var i=c.q("#tarea");i.value="   ";c.q("#agregar").click();return c.all("#tareas li").length===1}}, /* length 1 porque el test anterior ya dejó una tarea real */
  {d:"Al hacer clic sobre un <code>&lt;li&gt;</code>, alterna la clase 'hecha' (para marcar como completada)", t:function(c){var li=c.q("#tareas li");if(!li)return false;li.click();var a=li.classList.contains("hecha");li.click();return a&&!li.classList.contains("hecha")}}
 ]}
];

/* ------------------------------------------------------------------ */
/*  Estado                                                            */
/* ------------------------------------------------------------------ */
var KEY="ruta-web-v1";
var S={done:{},help:{},xp:0,days:[],code:{},current:"h1",hintN:{},tries:{}};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);for(var k in p)S[k]=p[k];}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

var $=function(id){return document.getElementById(id)};
var byId={};L.forEach(function(l,i){l.n=i;byId[l.id]=l});
var cur=byId[S.current]||L[0];

/* ------------------------------------------------------------------ */
/*  Resaltado de sintaxis                                             */
/* ------------------------------------------------------------------ */
var RX=/(<!--[\s\S]*?(?:-->|$)|\/\*[\s\S]*?(?:\*\/|$)|\/\/[^\n]*)|("(?:[^"\\\n]|\\.)*"?|'(?:[^'\\\n]|\\.)*'?)|(<\/?[a-zA-Z][\w-]*|\/?>)|([a-zA-Z-]+)(?==)|\b(const|let|var|function|return|if|else|for|while|of|new|async|await|true|false|null|undefined|this|document|console)\b|(--[\w-]+|[a-z-]+(?=\s*:\s*[^\s{]))|(\b\d+(?:\.\d+)?(?:px|rem|em|%|s|ms|fr|vh|vw)?\b)/g;
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function highlight(src){
  var out="",last=0,m;RX.lastIndex=0;
  var cls=[null,"com","str","tag","attr","kw","prop","num"];
  while((m=RX.exec(src))){
    if(m[0]===""){RX.lastIndex++;continue}
    out+=esc(src.slice(last,m.index));
    for(var g=1;g<cls.length;g++){if(m[g]!==undefined){out+='<span class="tk-'+cls[g]+'">'+esc(m[0])+"</span>";break}}
    last=RX.lastIndex;
  }
  return out+esc(src.slice(last));
}

/* ------------------------------------------------------------------ */
/*  Editor                                                            */
/* ------------------------------------------------------------------ */
var ta=$("code"),hl=$("hl"),gut=$("gutter");
function paint(){
  hl.innerHTML=highlight(ta.value)+"\n";
  var n=ta.value.split("\n").length,s="";for(var i=1;i<=n;i++)s+=i+"\n";gut.textContent=s;
  syncScroll();
}
function syncScroll(){hl.scrollTop=ta.scrollTop;hl.scrollLeft=ta.scrollLeft;gut.scrollTop=ta.scrollTop}
ta.addEventListener("scroll",syncScroll);
var runT;
ta.addEventListener("input",function(){paint();S.code[cur.id]=ta.value;save();clearTimeout(runT);runT=setTimeout(run,450)});
ta.addEventListener("keydown",function(e){
  if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){e.preventDefault();check();return}
  var s=ta.selectionStart,en=ta.selectionEnd,v=ta.value;
  if(e.key==="Tab"){
    e.preventDefault();
    if(s===en){insert("  ")}
    else{
      var ls=v.lastIndexOf("\n",s-1)+1,block=v.slice(ls,en);
      var nb=e.shiftKey?block.replace(/^ {1,2}/gm,""):block.replace(/^/gm,"  ");
      ta.setRangeText(nb,ls,en,"select");ta.dispatchEvent(new Event("input"));
    }
  }else if(e.key==="Enter"){
    var line=v.slice(v.lastIndexOf("\n",s-1)+1,s);var ind=(line.match(/^\s*/)||[""])[0];
    var prev=v[s-1];if(prev==="{"||prev===">"&&!/<\/[^>]*>$|\/>$/.test(line)&&/<[a-z]/i.test(line)) ind+="  ";
    e.preventDefault();insert("\n"+ind);
  }
});
function insert(t){ta.setRangeText(t,ta.selectionStart,ta.selectionEnd,"end");ta.dispatchEvent(new Event("input"))}

/* ------------------------------------------------------------------ */
/*  Vista previa + consola                                            */
/* ------------------------------------------------------------------ */
var frame=$("frame"),logs=[];
window.__cap=function(type,args){
  var text=args.map(function(a){
    if(typeof a==="string")return a;
    try{return JSON.stringify(a)}catch(e){return String(a)}
  }).join(" ");
  logs.push({type:type,text:text});renderConsole();
};
var PRE='<script>(function(){var P=window.parent;["log","info","warn","error"].forEach(function(k){var o=console[k];console[k]=function(){try{P.__cap(k==="info"?"log":k,[].slice.call(arguments))}catch(e){}o.apply(console,arguments)}});window.addEventListener("error",function(e){try{P.__cap("error",[e.message+(e.lineno?" (línea "+e.lineno+")":"")])}catch(x){}});})();<\/script>';
function run(){
  return new Promise(function(res){
    logs=[];renderConsole();
    frame.onload=function(){setTimeout(res,60)};
    frame.srcdoc='<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width">'+PRE+ta.value;
  });
}
function renderConsole(){
  var c=$("consolePane");
  if(!logs.length){c.innerHTML='<div class="empty">La consola está vacía. Usa console.log() en tu código para ver mensajes aquí.</div>'}
  else c.innerHTML=logs.map(function(l){return '<div class="'+(l.type==="error"?"err":l.type==="warn"?"warn":"")+'">'+(l.type==="error"?"✕ ":"› ")+esc(l.text)+"</div>"}).join("");
  var b=$("conBadge");b.hidden=!logs.length;b.textContent=logs.length;
}
function showTab(con){
  $("tabView").setAttribute("aria-selected",!con);$("tabCon").setAttribute("aria-selected",!!con);
  $("browserPane").hidden=!!con;$("consolePane").hidden=!con;
}
$("tabView").onclick=function(){showTab(false)};
$("tabCon").onclick=function(){showTab(true)};
$("runBtn").onclick=run;

/* ------------------------------------------------------------------ */
/*  Comprobación                                                      */
/* ------------------------------------------------------------------ */
function ctx(){
  var doc=frame.contentDocument,win=frame.contentWindow;
  return {doc:doc,win:win,logs:logs,code:ta.value,
    q:function(s){return doc.querySelector(s)},
    all:function(s){return Array.prototype.slice.call(doc.querySelectorAll(s))},
    txt:function(s){var e=doc.querySelector(s);return e?e.textContent:""},
    cs:function(e){return win.getComputedStyle(e)},
    ev:function(n){return win.eval(n)},
    rules:function(){var out=[];Array.prototype.forEach.call(doc.styleSheets,function(sh){try{Array.prototype.forEach.call(sh.cssRules,function(r){out.push(r)})}catch(e){}});return out}
  };
}
async function check(){
  await run();
  var c=ctx(),ul=$("checks"),items=ul.children,allOk=true;
  for(var i=0;i<cur.tests.length;i++){
    var ok=false;
    try{ok=!!(await Promise.race([Promise.resolve(cur.tests[i].t(c)),new Promise(function(r){setTimeout(function(){r(false)},2500)})]))}catch(e){ok=false}
    items[i].className=ok?"pass":"fail";items[i].querySelector(".st").textContent=ok?"✓":"✕";
    if(!ok)allOk=false;
  }
  if(allOk) complete();
  else{
    S.tries[cur.id]=(S.tries[cur.id]||0)+1;save();
    var n=cur.tests.filter(function(_,i){return items[i].className==="pass"}).length;
    toast(n+" de "+cur.tests.length+" comprobaciones superadas. ¡Sigue intentando!");
    if(logs.some(function(l){return l.type==="error"})){showTab(true)}
  }
}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function complete(){
  var first=!S.done[cur.id];
  if(first){
    var gain=S.help[cur.id]?5:10;S.xp+=gain;S.done[cur.id]=true;
    var t=today();if(S.days.indexOf(t)<0)S.days.push(t);
    var lvlDone=L.filter(function(l){return l.lvl===cur.lvl}).every(function(l){return S.done[l.id]});
    if(lvlDone){S.xp+=25}
    save();renderStats();renderSide();
    toast(lvlDone?"¡Nivel completado! +"+(gain+25)+" XP":"¡Lección superada! +"+gain+" XP");
  }
  var next=L[cur.n+1];
  $("win").innerHTML='<div class="win"><div><strong>'+(next?"¡Lo lograste!":"¡Terminaste la ruta completa!")+'</strong><p>'+(next?"Siguiente: "+next.title:"Ya tienes las bases de un desarrollador web. Tu lista de tareas es tu primer proyecto de portafolio.")+'</p></div>'+(next?'<button class="btn primary" id="nextBtn">Siguiente lección →</button>':'')+'</div>';
  if(next)$("nextBtn").onclick=function(){go(next.id)};
}

/* ------------------------------------------------------------------ */
/*  Pistas y solución                                                 */
/* ------------------------------------------------------------------ */
function renderHints(){
  var n=S.hintN[cur.id]||0;
  $("hints").innerHTML=cur.hints.slice(0,n).map(function(h,i){return '<div class="hint"><b>Pista '+(i+1)+':</b> '+h+'</div>'}).join("");
  $("hintBtn").disabled=n>=cur.hints.length;
  $("hintBtn").textContent=n>=cur.hints.length?"Sin más pistas":"Pedir pista ("+(cur.hints.length-n)+")";
}
$("hintBtn").onclick=function(){S.hintN[cur.id]=Math.min((S.hintN[cur.id]||0)+1,cur.hints.length);save();renderHints()};
$("solBtn").onclick=function(){
  var box=$("solution");
  if(box.innerHTML){box.innerHTML="";$("solBtn").textContent="Ver solución";return}
  if(!S.done[cur.id]&&(S.tries[cur.id]||0)<1){
    box.innerHTML='<div class="hint"><b>Inténtalo primero:</b> pulsa “Comprobar” al menos una vez. Equivocarse es parte de aprender. Luego podrás ver la solución.</div>';
    return;
  }
  box.innerHTML='<div class="ex-label">Solución de referencia</div><div class="example">'+highlight(cur.solution)+'</div><button class="btn" id="useSol">Cargar en el editor</button>';
  $("solBtn").textContent="Ocultar solución";
  $("useSol").onclick=function(){
    if(!S.done[cur.id]){S.help[cur.id]=true;save()}
    ta.value=cur.solution;ta.dispatchEvent(new Event("input"));
    toast("Solución cargada. Léela línea por línea y luego pulsa Comprobar.");
  };
};
$("resetBtn").onclick=function(){ta.value=cur.starter;ta.dispatchEvent(new Event("input"));toast("Código reiniciado")};
$("checkBtn").onclick=check;

/* ------------------------------------------------------------------ */
/*  Navegación y render                                               */
/* ------------------------------------------------------------------ */
function renderSide(){
  var h="";
  LEVELS.forEach(function(lv){
    var ls=L.filter(function(l){return l.lvl===lv.id}),d=ls.filter(function(l){return S.done[l.id]}).length;
    h+='<div class="lvl"><div class="lvl-h"><h3>'+lv.name+'</h3><span>'+d+'/'+ls.length+'</span></div><div class="lvl-sub">'+lv.sub+'</div><ul class="path">';
    ls.forEach(function(l){
      var st=S.done[l.id]?(S.help[l.id]?"help":"done"):"";
      h+='<li class="'+st+'"><button data-id="'+l.id+'" aria-current="'+(l.id===cur.id)+'"><span class="dot">'+(st?"✓":"")+'</span>'+l.title+'</button></li>';
    });
    h+='</ul></div>';
  });
  $("side").innerHTML=h;
  Array.prototype.forEach.call($("side").querySelectorAll("button[data-id]"),function(b){b.onclick=function(){go(b.dataset.id);closeSide()}});
}
function streak(){
  var set={};S.days.forEach(function(d){set[d]=1});
  var d=new Date(),n=0;
  if(!set[today()]){d.setDate(d.getDate()-1)}
  while(true){var k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");if(set[k]){n++;d.setDate(d.getDate()-1)}else break}
  return n;
}
function renderStats(){
  var d=Object.keys(S.done).length;
  $("xp").textContent=S.xp;$("streak").textContent=streak();
  $("progTxt").textContent=d+"/"+L.length;$("progBar").style.width=(d/L.length*100)+"%";
}
function go(id){
  cur=byId[id];S.current=id;save();
  var lv=LEVELS.filter(function(x){return x.id===cur.lvl})[0];
  $("lvlTag").textContent=lv.name;
  $("lessonNum").textContent="Lección "+(cur.n+1)+" de "+L.length;
  $("mins").textContent="≈ "+cur.mins+" min";
  $("lTitle").textContent=cur.title;
  $("theory").innerHTML=cur.theory+'<div class="ex-label">Ejemplo</div><div class="example">'+highlight(cur.example)+'</div>';
  $("task").innerHTML=cur.task;
  $("checks").innerHTML=cur.tests.map(function(t){return '<li><span class="st"></span><span>'+t.d+'</span></li>'}).join("");
  $("solution").innerHTML="";$("solBtn").textContent="Ver solución";
  $("win").innerHTML="";
  renderHints();
  ta.value=S.code[id]!=null?S.code[id]:cur.starter;paint();ta.scrollTop=0;
  showTab(false);
  run();renderSide();
  $("lesson").scrollTop=0;
  if(S.done[id]){$("win").innerHTML='<div class="win"><div><strong>Lección completada</strong><p>Puedes repasarla o seguir adelante.</p></div>'+(L[cur.n+1]?'<button class="btn primary" id="nextBtn">Siguiente lección →</button>':'')+'</div>';if(L[cur.n+1])$("nextBtn").onclick=function(){go(L[cur.n+1].id)}}
}

/* Menú lateral en pantallas medianas */
function closeSide(){$("side").classList.remove("open");$("scrim").classList.remove("open")}
$("menuBtn").onclick=function(){$("side").classList.add("open");$("scrim").classList.add("open")};
$("scrim").onclick=closeSide;

var tT;function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(tT);tT=setTimeout(function(){t.classList.remove("show")},2600)}

renderStats();go(cur.id);
</script>

</body></html>
